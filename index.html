<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test d'envoi d'e-mail</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    input, textarea, button { box-sizing: border-box; width: 100%; padding: 11px; font: inherit; }
    textarea { min-height: 120px; }
    button { margin-top: 16px; cursor: pointer; }
    #status { margin-top: 14px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Test d'envoi d'e-mail</h1>
  <p>Ce formulaire envoie un message via une fonction Netlify. La clé Resend reste côté serveur.</p>

  <form id="emailForm">
    <label for="to">Adresse du destinataire</label>
    <input id="to" name="to" type="email" autocomplete="email" required>

    <label for="subject">Objet</label>
    <input id="subject" name="subject" value="Test depuis mon site" maxlength="150" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" maxlength="5000" required>Bonjour, ceci est un e-mail de test.</textarea>

    <button id="sendButton" type="submit">Envoyer le test</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>

  <script>
    const form = document.getElementById("emailForm");
    const button = document.getElementById("sendButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = "Envoi en cours…";

      const payload = {
        to: document.getElementById("to").value.trim(),
        subject: document.getElementById("subject").value.trim(),
        message: document.getElementById("message").value.trim()
      };

      try {
        const response = await fetch("/.netlify/functions/send-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(result.error || "Échec de l'envoi (HTTP " + response.status + ").");
        }
        status.textContent = "Demande acceptée par Resend. Vérifie la boîte de réception et les spams.";
        form.reset();
      } catch (error) {
        status.textContent = "Erreur : " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
